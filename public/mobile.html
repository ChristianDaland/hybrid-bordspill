<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#14100c">
  <title>Shufflebord</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root { --bg: #14100c; --panel: #241c14; --panel-2: #33291e; --line: #4a3b2d; --text: #f6ecdf; --muted: #b3a491; --brass: #e2b35c; --good: #4fd08f; }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; overscroll-behavior: none; }
    body { background: var(--bg); color: var(--text); font-family: system-ui, 'Segoe UI', sans-serif; overflow: hidden; user-select: none; -webkit-user-select: none; }
    button { font: inherit; color: inherit; border: none; }
    [hidden] { display: none !important; }

    #join { height: 100dvh; display: flex; flex-direction: column; justify-content: center; padding: 24px; gap: 14px; text-align: center; }
    #join h1 { font-family: Georgia, serif; color: var(--brass); font-size: 2.3rem; }
    #join p { color: var(--muted); }
    #nameInput { width: 100%; padding: 15px; font-size: 1.15rem; text-align: center; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--text); user-select: text; -webkit-user-select: text; }
    .btn { width: 100%; padding: 15px; border-radius: 10px; font-size: 1.1rem; font-weight: 800; background: var(--brass); color: #231708; }
    .btn:disabled { opacity: .45; }

    #game { height: 100dvh; display: flex; flex-direction: column; padding: max(10px, env(safe-area-inset-top)) 12px max(10px, env(safe-area-inset-bottom)); gap: 8px; }
    header { display: flex; align-items: center; gap: 9px; }
    #myDot { width: 20px; height: 20px; border-radius: 50%; box-shadow: inset 0 0 0 2px #fff9; flex: none; }
    #myName { font-weight: 700; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #myScore { font-size: 1.3rem; font-weight: 800; color: var(--brass); font-variant-numeric: tabular-nums; }
    #myScore small { font-size: .78rem; color: var(--good); margin-right: 5px; }

    #status { padding: 11px; border-radius: 10px; text-align: center; font-weight: 700; background: var(--panel-2); transition: background .2s; min-height: 44px; overflow-wrap: anywhere; }
    #status.mine { background: var(--good); color: #06281a; font-size: 1.15rem; }
    #status.warn { background: #e5574f; color: #fff; }
    #offline { background: #7a2c28; padding: 6px; text-align: center; border-radius: 8px; font-size: .86rem; }

    #stage { flex: 1; min-height: 0; position: relative; border-radius: 14px; background: var(--panel); overflow: hidden; }
    #pad { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
    #panel { position: absolute; inset: 0; padding: 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; text-align: center; }
    #panel h2 { font-family: Georgia, serif; color: var(--brass); font-size: 1.7rem; }
    #panel .big { font-size: 3.2rem; font-weight: 800; }
    #panel .muted { color: var(--muted); }
    .list { list-style: none; display: flex; flex-direction: column; gap: 5px; text-align: left; }
    .list li { display: flex; align-items: center; gap: 8px; background: var(--panel-2); padding: 8px 10px; border-radius: 8px; font-weight: 600; }
    .list li.me { outline: 1px solid var(--brass); }
    .list .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
    .list .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .spacer { flex: 1; }
    #startBar { position: absolute; left: 12px; right: 12px; bottom: 12px; }

    #reactions { display: flex; justify-content: space-between; gap: 5px; }
    #reactions button { flex: 1; font-size: 1.55rem; padding: 7px 0; border-radius: 10px; background: var(--panel-2); line-height: 1; }
    #reactions button:active { transform: scale(.88); }
  </style>
</head>
<body>
  <section id="join">
    <h1>Shufflebord</h1>
    <p id="joinNote">Skriv navnet ditt for å bli med.</p>
    <input id="nameInput" maxlength="16" placeholder="Ditt navn" autocomplete="off" enterkeyhint="go">
    <button class="btn" id="joinBtn">Bli med</button>
  </section>

  <section id="game" hidden>
    <header>
      <span id="myDot"></span>
      <span id="myName"></span>
      <span id="myScore"></span>
    </header>
    <div id="offline" hidden>Mistet forbindelsen. Kobler til igjen …</div>
    <div id="status"></div>
    <div id="stage">
      <canvas id="pad"></canvas>
      <div id="panel" hidden></div>
      <div id="startBar" hidden><button class="btn" id="startBtn">Start spillet</button></div>
    </div>
    <div id="reactions"></div>
  </section>

  <script src="/mobile.js"></script>
</body>
</html>
